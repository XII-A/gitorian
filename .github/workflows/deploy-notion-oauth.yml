name: Deploy Notion OAuth

on:
    release:
        types: [published]

permissions:
    contents: read

concurrency:
    group: notion-oauth-production
    cancel-in-progress: false

jobs:
    deploy:
        if: github.event.release.prerelease == false
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        environment: notion-oauth-production
        env:
            RELEASE_TAG: ${{ github.event.release.tag_name }}
            NOTION_OAUTH_ORIGIN: ${{ vars.NOTION_OAUTH_ORIGIN }}
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ github.event.release.tag_name }}
                  fetch-depth: 0
                  persist-credentials: false
            - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
                  cache: pnpm
            - name: Validate release and deployment configuration
              env:
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
              run: |
                  set -euo pipefail
                  test -n "$NETLIFY_SITE_ID" && test -n "$NETLIFY_AUTH_TOKEN"
                  node --input-type=module -e 'import p from "./package.json" with { type: "json" }; if (process.env.RELEASE_TAG !== `v${p.version}` || !/^v\d+\.\d+\.\d+$/.test(process.env.RELEASE_TAG)) throw Error("Release tag must match package.json"); const u = new URL(process.env.NOTION_OAUTH_ORIGIN); if (u.protocol !== "https:" || u.origin !== process.env.NOTION_OAUTH_ORIGIN) throw Error("Configure the production OAuth origin without a trailing slash");'
                  test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
                  git merge-base --is-ancestor HEAD origin/main
            - run: pnpm install --frozen-lockfile
            - run: pnpm check
            - run: pnpm --filter @weekly-j/notion-oauth build
            - name: Deploy the released OAuth module
              env:
                  NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
                  NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
              run: pnpm --package=netlify-cli@27.14.1 dlx netlify deploy --prod --no-build --dir services/notion-oauth/public --functions services/notion-oauth/dist/functions --message "weekly-j $RELEASE_TAG"
            - name: Check deployed OAuth module
              run: curl --fail --retry 3 --retry-delay 2 "$NOTION_OAUTH_ORIGIN/health"
