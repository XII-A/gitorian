name: Desktop checks
on:
    push:
    pull_request:
jobs:
    check:
        strategy:
            fail-fast: false
            matrix:
                os: [windows-latest, macos-latest, ubuntu-latest]
        runs-on: ${{ matrix.os }}
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run package:dir
              env:
                  CSC_IDENTITY_AUTO_DISCOVERY: 'false'
            - run: npm run smoke
              if: runner.os != 'Linux'
            - run: xvfb-run --auto-servernum npm run smoke
              if: runner.os == 'Linux'
