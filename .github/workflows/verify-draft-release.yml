name: Verify exact draft assets

on:
    workflow_dispatch:
        inputs:
            tag:
                description: Unpublished release tag to install and verify
                required: true
                default: v0.1.6
                type: string

permissions:
    contents: read

jobs:
    verify:
        name: Install exact draft on disposable Windows
        runs-on: windows-2022
        timeout-minutes: 20
        permissions:
            # GitHub hides unpublished releases from read-only tokens. The token
            # is exposed only to the asset-download step, never the installed app.
            contents: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: main
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
            - name: Download the unpublished release assets
              shell: pwsh
              env:
                  GH_TOKEN: ${{ github.token }}
                  GH_REPO: ${{ github.repository }}
                  RELEASE_TAG: ${{ inputs.tag }}
              run: |
                  $ErrorActionPreference = 'Stop'
                  if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') { throw 'Expected a version tag.' }
                  $release = gh release view $env:RELEASE_TAG --json isDraft,tagName,assets | ConvertFrom-Json
                  if ($LASTEXITCODE -ne 0 -or -not $release.isDraft) { throw 'Only unpublished drafts may be verified.' }
                  $release | ConvertTo-Json -Depth 8 | Set-Content draft-release.json
                  gh release download $env:RELEASE_TAG --dir draft-assets
                  if ($LASTEXITCODE -ne 0) { throw 'Draft asset download failed.' }
            - name: Install, exercise, restart and uninstall the exact installer
              shell: pwsh
              env:
                  RELEASE_TAG: ${{ inputs.tag }}
              run: node tools/verify-draft-assets.mjs draft-assets .ai-docs/verification/exact-draft
            - name: Retain verification evidence
              if: always()
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
              with:
                  name: exact-draft-verification
                  path: |
                      .ai-docs/verification/exact-draft/
                      draft-release.json
                  if-no-files-found: error
                  include-hidden-files: true
                  retention-days: 14
